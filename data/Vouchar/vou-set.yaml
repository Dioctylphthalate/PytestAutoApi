# 公共参数
case_common:
  allureEpic: 测试平台接口
  allureFeature: 凭证模块
  allureStory: 凭证设置



update_code_set:
    host: ${{host()}}
    url: /api/voucher/es_voucher/update_code_set
    method: POST
    detail: 设置公共配置
    headers:
      Authorization: $cache{Authorization}
#      Content-Type: multipart/form-data;
    # 请求的数据，是 params 还是 json、或者file、data
    requestType: json
    # 是否执行，空或者 true 都会执行
    is_run:
    data:
      nodeTypeGuid: info
      exclude: false
      fldAreaGuid:
        - $cache{areaguid}
      fldAttribute: [ ]
      fldEndDate: ''
      fldExcludeFee:
        - 4
      fldExcludeQiFei: false
      fldIsBeforeFee: true
      fldLiveType: [ ]
      fldObjectList: [ ]
      fldOwnerList: [ ]
      fldProjectList: [ ]
      fldStartDate: ''
      fldStatisticsDate: ''
      operatorDate: ''
      income: false
      incomeSource: false
      isPage: false
      memoryAdr: ''
      modelType: 0
      pageIndex: 0
      pageSize: 100
      projectMode: 1
      selectDate: '2024'
      selectType: 0
      timeType: 0
      excludeZero: false

      # 是否有依赖业务，为空或者false则表示没有
    dependence_case: False
        # 依赖的数据
    dependence_case_data:
    assert:
      # 断言接口状态码
      errorCode:
        jsonpath: $.code
        type: ==
        value: 200
        AssertType:
      # 断言接口返回的username
      errorMsg:
        jsonpath: $.message
        type: ==
        value: "操作成功！"
        AssertType:
    sql:


