<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>获取并跳转网址</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  #getURLBtn {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
  #loader {
    display: none;
  }
</style>
</head>
<body>

<button id="getURLBtn">获取网址</button>
<div id="loader">加载中...</div>
<div id="urlContainer"></div>

<script>
document.getElementById("getURLBtn").addEventListener("click", function() {
    // 隐藏获取网址按钮，显示加载图标
    document.getElementById("getURLBtn").style.display = "none";
    document.getElementById("loader").style.display = "block";

    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
        if (xhr.readyState === XMLHttpRequest.DONE) {
            if (xhr.status === 200) {
                var response = xhr.responseText;
                // 隐藏加载图标，显示获取到的链接并跳转
                document.getElementById("loader").style.display = "none";
                document.getElementById("urlContainer").innerHTML = '<a href="' + response + '" target="_blank">' + response + '</a>';
                // 自动跳转到链接
                window.open(response, "_blank");
                window.close();
            } else {
                console.error("Error:", xhr.status);
            }
        }
    };
    xhr.open("GET", "http://127.0.0.1:1234", true);
    xhr.send();
});
</script>

</body>
</html>
